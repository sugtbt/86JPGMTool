name: Sync Upstream and Build Release

on:
  # 允许手动触发
  workflow_dispatch:
  # 每天定时检查更新 (可根据需要调整 cron 表达式)
  schedule:
    - cron: '0 0 * * *'

# 确保 Action 拥有写入权限以推送合并后的代码和创建 Release
permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取完整历史记录以便进行 merge
          
      - name: Sync upstream via Merge
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加上游仓库
          git remote add upstream https://gitgud.io/rewio/86JPGMTool.git || true
          git fetch upstream
          
          # 自动检测上游默认分支 (main 或 master)
          UPSTREAM_BRANCH=$(git symbolic-ref refs/remotes/upstream/HEAD 2>/dev/null | sed 's@^refs/remotes/upstream/@@' || echo "")
          if [ -z "$UPSTREAM_BRANCH" ]; then
            if git show-ref --verify --quiet refs/remotes/upstream/main; then
              UPSTREAM_BRANCH="main"
            else
              UPSTREAM_BRANCH="master"
            fi
          fi
          
          echo "Merging from upstream/$UPSTREAM_BRANCH"
          BEFORE_COMMIT=$(git rev-parse HEAD)
          
          # 执行 merge，--allow-unrelated-histories 防止首次合并时报错
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit --allow-unrelated-histories || echo "Merge completed or already up to date."
          
          AFTER_COMMIT=$(git rev-parse HEAD)
          
          # 判断是否有新提交
          if [ "$BEFORE_COMMIT" != "$AFTER_COMMIT" ]; then
            echo "Updates found. Pushing merge commit..."
            git push origin HEAD:${{ github.ref }}
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "No updates from upstream."
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: Setup .NET 10.0
        if: env.HAS_UPDATE == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        if: env.HAS_UPDATE == 'true'
        run: dotnet restore

      - name: Build Project
        if: env.HAS_UPDATE == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Publish Project
        if: env.HAS_UPDATE == 'true'
        run: dotnet publish -c Release -o ./publish_output

      - name: Package with wwwroot
        if: env.HAS_UPDATE == 'true'
        run: |
          # dotnet publish 通常会自动将 wwwroot 复制到输出目录
          # 此处增加兜底逻辑：如果输出目录缺少 wwwroot，则从源码目录手动复制
          if [ -d "./wwwroot" ] && [ ! -d "./publish_output/wwwroot" ]; then
            echo "Copying wwwroot to publish output..."
            cp -r ./wwwroot ./publish_output/
          fi
          
          # 打包发布目录
          cd publish_output
          zip -r ../86JPGMTool-Release.zip .

      - name: Create GitHub Release
        if: env.HAS_UPDATE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: 86JPGMTool-Release.zip
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
